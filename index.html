	function setLanguage(lang) {

		document.getElementById('about-text').textContent = t.about_text;
		document.getElementById('education-text').textContent = t.education_text;

		document.querySelectorAll('[data-i18n]').forEach(el => {
			const key = el.getAttribute('data-i18n');
			if (t[key]) {
				el.textContent = t[key];
			}
		});

		// Experience
		const exp = document.getElementById('experience-content');
		exp.innerHTML = '';
		t.experience_list.forEach(job => {
			const block = document.createElement('div');
			block.innerHTML = `<h3>${job.title}</h3><p>${job.period}</p><ul>${job.tasks.map(task => `<li>${task}</li>`).join('')}</ul>`;
			exp.appendChild(block);
		});

		// Services
		const services = document.getElementById('services-list');
		services.innerHTML = '';
		t.service_list.forEach(item => {
			const li = document.createElement('li');
			li.textContent = item;
			services.appendChild(li);
		});

		// Projects
		const projects = document.getElementById('project-list');
		projects.innerHTML = '';
		t.project_list.forEach(pr => {
			const imgHtml = pr.img ? `<img src="${pr.img}" alt="${pr.title}">` : '';

			const linkEnd = pr.link ? '</a>' : '';
			const tagsHtml = pr.tags ? `<div class="project-tags">${pr.tags.map(tag => `<span>${tag}</span>`).join('')}</div>` : '';
			const badgeHtml = pr.period ? `<span class="project-badge">${pr.period}</span>` : '';
			projects.innerHTML += `
				<div class="project-card${noImgClass}">
					${imgHtml}
					<div class="content">
						${badgeHtml}
						<h3>${linkStart}${pr.title}${linkEnd}</h3>
						<p>${pr.desc}</p>
						${tagsHtml}
					</div>
				</div>`;
		});
